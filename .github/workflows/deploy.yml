# Compila web/ y lo publica en el VPS de Hostinger en cada push a main.
# Configuración en GitHub → Settings → Secrets and variables → Actions:
#   Variables: VPS_HOST (IP del VPS), VPS_USER (usuario SSH), VPS_PATH (carpeta web, /var/www/pvclacurva.com)
#   Secretos:  VPS_SSH_KEY (clave privada SSH del usuario de despliegue)
name: Publicar sitio

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - name: Preparar SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ vars.VPS_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
      - name: Subir al VPS
        env:
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_USER: ${{ vars.VPS_USER }}
          VPS_PATH: ${{ vars.VPS_PATH }}
        run: |
          rsync -az --delete -e "ssh -i ~/.ssh/id_deploy" web/dist/ "$VPS_USER@$VPS_HOST:$VPS_PATH/"
